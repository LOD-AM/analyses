name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System libraries (Redland RDF for rdflib, libuv)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librdf0-dev libraptor2-dev librasqal3-dev libuv1-dev libcurl4-openssl-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"        # as in renv.lock
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Unit tests
        run: Rscript tests/testthat.R
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Knowledge-graph tools
        run: |
          git clone --depth 1 https://github.com/LOD-AM/knowledge-graph ../knowledge-graph
          python3 -m pip install -q -r ../knowledge-graph/requirements.txt
          make -C ../knowledge-graph fetch
      - name: Run records in runs/ against the knowledge-graph rules and the pinned release
        run: scripts/check_runs.sh ../knowledge-graph
      - name: End to end (the template on the pinned release, never committed)
        run: |
          out=$(mktemp -d)
          rec=$(Rscript tests/e2e_run_record.R "$out" | tail -1)
          scripts/check_runs.sh ../knowledge-graph $rec

  shared-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check_shared_block.sh
